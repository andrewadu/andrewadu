name: Profile README

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out profile
        uses: actions/checkout@v7

      - name: Validate profile content
        run: |
          python - <<'PY'
          from pathlib import Path

          readme = Path("README.md")
          assert readme.is_file(), "README.md is missing"
          text = readme.read_text(encoding="utf-8")
          required = [
              "https://builtbyandie.dev",
              "https://www.linkedin.com/in/andrew-adu/",
              "mailto:andie.89@icloud.com",
              "Frontend engineering",
              "AI-enabled engineering",
              "Owner-reported production outcomes",
              "90% of polling stations",
              "8,000 peak connected terminals",
              "95% of requests completing in under one second",
              "200M+ legacy supplier records",
              "GHS 400M+ in collections",
          ]
          missing = [value for value in required if value not in text]
          assert not missing, f"Missing required profile content: {missing}"
          assert all(not line.endswith((" ", "\t")) for line in text.splitlines()), "Trailing whitespace found"
          print("Profile README validation passed")
          PY
